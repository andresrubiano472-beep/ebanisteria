{% extends "Base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
<style>
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(to right, #f7f7f7, #ececec); 
    position: relative;
    min-height: 100vh;
    overflow-y: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url("{{ url_for('static', filename='img/Fondo.png')}}" ) no-repeat center center fixed;
    background-size: cover;
    opacity: 0.6; 
    z-index: -1;
  }

  .register-box {
    background-color: #1e1e1e;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    position: relative;
    z-index: 1;

  }
</style>

<!--Inicio de la logica del formulario-->

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="register-box col-12 col-md-6 col-lg-4">
    <h2 class="text-center fw-bold mb-3" style="color: coral;">Registro</h2>
    <p class="text-center text-muted">Completa los datos para crear tu cuenta</p>

    <form method="POST" action="{{ url_for('auth.register') }}" id="registerForm">
      {{ csrf_input }}
      <div class="mb-3">
        <label for="identity card" class="form-label fw-bold">Documento de identidad</label>
        <input type="text" class="form-control" id="indentity card" placeholder="Ingrese su documento de identidad" name="documentoidentidad" required>
      </div>
<!--Nombre Completo de Tipo texto-->      
      <div class="mb-3">
        <label for="fullName" class="form-label fw-bold">Nombre completo</label>
        <input type="text" class="form-control" name="nombreregistro" id="fullName" placeholder="Ingresa tu nombre" required>
      </div>
<!--Correo Electronico Register-->
      <div class="mb-3">
        <label for="email" class="form-label fw-bold ">Email</label>
        <input type="email" class="form-control" name="emailregistro" id="email" placeholder="Ingresa tu correo" required>
      </div>
<!--Grado-->
      <div class="mb-3">
        <label for="text" class="form-label fw-bold">Grado</label>
        <select name="option-cursos" id="cursos" class="form" style="border-radius: 20px; height: 50px; width: 100%;">
          {% for valor, nombre in grados %}
          <option value="{{ valor }}">{{ nombre }}</option>
          {% endfor %}
        </select>
      </div>
<!--Contraseña-->
      <div class="mb-3">
        <label for="password" class="form-label fw-bold">Contraseña</label>
        <input type="password" class="form-control" id="password" name="passwordregistro" placeholder="Crea una contraseña" required>
      </div>

<!--Boton Tipo enviar contraseña-->
      <div class="mb-3">
        <label for="confirmPassword" class="form-label fw-bold">Confirmar contraseña</label>
        <input type="password" class="form-control" id="confirmPassword" name="confirmpassword" placeholder="Repite tu contraseña" required>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-dark fw-bold">Registrarse</button>
      </div>
<!--Boton de inicio de sesion-->
      <div class="mt-3 text-center">
        <p class="text-muted">¿Ya tienes cuenta? <a href="/Login">Inicia sesión</a></p>
      </div>
    </form>
  </div>
</div>

<script>
  document.getElementById('registerForm').addEventListener('submit', function (e) {
    if (document.getElementById('password').value !== document.getElementById('confirmPassword').value) {
      e.preventDefault();
      alert('Las contraseñas no coinciden.');
    }
  });
</script>
{% endblock %}
